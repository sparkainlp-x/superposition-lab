[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superposition-lab"
version = "0.1.0"
description = "SYNTHETIC superposition, coherent-transport and energy-sideband simulations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
superposition-lab = "superposition_lab.cli:main"

[tool.setuptools.packages.find]
include = ["superposition_lab*"]
